name            = "casamento-api"
main            = "index.js"
compatibility_date = "2024-09-23"

# Variáveis públicas (não sensíveis) — sobrescrever por ambiente
[vars]
FRONTEND_URL = "https://seudominio.com"
WORKER_URL   = "https://casamento-api.seu-usuario.workers.dev"

# Segredos sensíveis — definir via CLI:
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_KEY
#   wrangler secret put ASAAS_API_KEY
#   wrangler secret put ASAAS_WEBHOOK_TOKEN

# Ambiente de produção (opcional — sobrescreve [vars] acima)
[env.production]
name = "casamento-api"
